  <style>
    @import url('https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

    
    :root {
      --bg-rose: #f7e5ea;
      --bg-peach: #f8efe9;
      --bg-cream: #fffaf3;
      --ink: #5a3441;
      --ink-soft: #7c5260;
      --accent: #c9859d;
      --accent-soft: #f0cfd9;
      --gold: #d6b17a;
      --panel: rgba(255, 247, 251, 0.82);
      --panel-border: rgba(255, 236, 244, 0.95);
      --photo-w: clamp(142px, 13vw, 194px);
      --photo-h: clamp(176px, 16vw, 242px);
      --ring-w: clamp(170px, 16vw, 230px);
      --ring-h: clamp(226px, 20vw, 305px);
      --shadow-soft: 0 18px 45px rgba(92, 52, 65, 0.15);
      --shadow-card: 0 16px 34px rgba(76, 42, 52, 0.18);
      --music-level: 0;
      --music-bass: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--ink);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.28)),
        url("fondo/Copilot_20260310_012828.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.22;
      background-image:
        radial-gradient(circle at 18% 28%, rgba(255, 255, 255, 0.65) 0 1px, transparent 2px),
        radial-gradient(circle at 66% 36%, rgba(255, 255, 255, 0.45) 0 1px, transparent 2px),
        radial-gradient(circle at 38% 76%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2px),
        radial-gradient(circle at 84% 84%, rgba(255, 255, 255, 0.5) 0 1px, transparent 2px);
      background-size: 180px 180px, 160px 160px, 200px 200px, 220px 220px;
    }

    .border-romance {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      perspective: 1000px;
    }

    .border-romance::after {
      content: "";
      position: absolute;
      inset: clamp(8px, 1.2vw, 16px);
      border-radius: 26px;
      border: 2px solid rgba(214, 160, 181, 0.68);
      box-shadow:
        inset 0 0 0 1px rgba(255, 226, 236, 0.75),
        0 0 18px rgba(196, 132, 156, 0.3);
    }

    .border-romance::before {
      content: "";
      position: absolute;
      inset: clamp(8px, 1.2vw, 16px);
      border-radius: 26px;
      background:
        linear-gradient(to bottom, rgba(245, 191, 210, 0.34), transparent 16%, transparent 84%, rgba(228, 171, 193, 0.4)),
        linear-gradient(to right, rgba(241, 186, 208, 0.34), transparent 14%, transparent 86%, rgba(227, 170, 192, 0.34));
      pointer-events: none;
    }

    .beat-hearts {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .beat-heart {
      position: absolute;
      left: var(--x);
      bottom: -9vmin;
      width: var(--size);
      height: var(--size);
      pointer-events: none;
      opacity: 0;
      border-radius: 18% 18% 4% 18%;
      background: hsl(var(--heart-hue), 74%, var(--heart-light));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32);
      transform: translate(-50%, 0) rotate(calc(var(--rot) + 45deg)) scale(0.2);
      animation: beatHeartFloat var(--dur) cubic-bezier(.18,.72,.2,1) forwards;
      filter: drop-shadow(0 8px 14px rgba(126, 57, 82, 0.22));
    }

    .beat-heart::before,
    .beat-heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .beat-heart::before {
      left: -50%;
      top: 0;
    }

    .beat-heart::after {
      left: 0;
      top: -50%;
    }

    body.music-reactive .bubbles {
      opacity: calc(0.88 + (var(--music-level) * 0.12));
    }

    .bubbles {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .bubble {
      position: absolute;
      z-index: 200;
      border-radius: 50%;
    }

    .bubble:nth-child(1) { top: 8%; left: 60%; height: 11vmin; width: 11vmin; animation: love-burst 3s infinite 0s; box-shadow: inset 0 0 0 5.5vmin transparent; transform: translate(0, 0.05em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(2) { top: 83%; left: 14%; height: 20vmin; width: 20vmin; animation: love-burst 3s infinite 0.15s; box-shadow: inset 0 0 0 10vmin transparent; transform: translate(0, 0.75em) scale(0); transform-origin: center bottom; }

    .bubble:nth-child(4) { top: 63%; left: 93%; height: 3vmin; width: 3vmin; animation: love-burst 3s infinite 0.45s; box-shadow: inset 0 0 0 1.5vmin transparent; transform: translate(0, 0.35em) scale(0); transform-origin: center bottom; }

    .bubble:nth-child(9) { top: 24%; left: 45%; height: 11vmin; width: 11vmin; animation: love-burst 3s infinite 1.2s; box-shadow: inset 0 0 0 5.5vmin transparent; transform: translate(0, 1em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(10) { top: 13%; left: 10%; height: 19vmin; width: 19vmin; animation: love-burst 3s infinite 1.35s; box-shadow: inset 0 0 0 9.5vmin transparent; transform: translate(0, 1em) scale(0); transform-origin: center bottom; }

    .bubble:nth-child(12) { top: 22%; left: 8%; height: 17vmin; width: 17vmin; animation: love-burst 3s infinite 1.65s; box-shadow: inset 0 0 0 8.5vmin transparent; transform: translate(0, 0.2em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(13) { top: 23%; left: 81%; height: 16vmin; width: 16vmin; animation: love-burst 3s infinite 1.8s; box-shadow: inset 0 0 0 8vmin transparent; transform: translate(0, 0.1em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(14) { top: 77%; left: 88%; height: 3vmin; width: 3vmin; animation: love-burst 3s infinite 1.95s; box-shadow: inset 0 0 0 1.5vmin transparent; transform: translate(0, 0.45em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(15) { top: 41%; left: 1%; height: 9vmin; width: 9vmin; animation: love-burst 3s infinite 2.1s; box-shadow: inset 0 0 0 4.5vmin transparent; transform: translate(0, 0.05em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(16) { top: 51%; left: 51%; height: 8vmin; width: 8vmin; animation: love-burst 3s infinite 2.25s; box-shadow: inset 0 0 0 4vmin transparent; transform: translate(0, 1.15em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(17) { top: 37%; left: 65%; height: 11vmin; width: 11vmin; animation: love-burst 3s infinite 2.4s; box-shadow: inset 0 0 0 5.5vmin transparent; transform: translate(0, 0.2em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(18) { top: 11%; left: 83%; height: 18vmin; width: 18vmin; animation: love-burst 3s infinite 2.55s; box-shadow: inset 0 0 0 9vmin transparent; transform: translate(0, 0.9em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(19) { top: 64%; left: 86%; height: 12vmin; width: 12vmin; animation: love-burst 3s infinite 2.7s; box-shadow: inset 0 0 0 6vmin transparent; transform: translate(0, 0.65em) scale(0); transform-origin: center bottom; }
    .bubble:nth-child(20) { top: 39%; left: 24%; height: 19vmin; width: 19vmin; animation: love-burst 3s infinite 2.85s; box-shadow: inset 0 0 0 9.5vmin transparent; transform: translate(0, 0.2em) scale(0); transform-origin: center bottom; }

    .heart {
      fill: transparent;
      opacity: 0;
    }

    .bubble:nth-child(1) .heart { animation: love 3s forwards infinite 0s; transform: scale(0.5) rotate(-4deg); }
    .bubble:nth-child(2) .heart { animation: love 3s forwards infinite 0.15s; transform: scale(0.5) rotate(22deg); }
    .bubble:nth-child(3) .heart { animation: love 3s forwards infinite 0.3s; transform: scale(0.5) rotate(-5deg); }

    main {
      position: relative;
      z-index: 1;
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: clamp(1rem, 2vw, 2rem) clamp(0.65rem, 1.4vw, 1.4rem) clamp(1.4rem, 2.5vw, 2.6rem);
      height: 100dvh;
      max-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(0.65rem, 1.4vw, 1rem);
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-bottom: clamp(0.85rem, 1.8vw, 1.5rem);
      animation: fadeUp 600ms ease both;
    }

    h1 {
      margin: 0;
      font-family: "Allura", "Times New Roman", cursive;
      font-size: clamp(2.9rem, 7vw, 6rem);
      line-height: 0.94;
      letter-spacing: 0.02em;
      color: #8a4058;
      text-shadow: 0 8px 18px rgba(146, 86, 104, 0.2);
      font-weight: 400;
    }

    .subtitle {
      margin: 0.35rem auto 0;
      max-width: 860px;
      font-size: clamp(1.02rem, 1.8vw, 1.45rem);
      line-height: 1.32;
      color: var(--ink-soft);
    }

    .book {
      display: grid;
      gap: clamp(0.65rem, 1.4vw, 1rem);
      min-height: 0;
      height: 100%;
      grid-template-rows: auto 1fr;
    }

    .book-nav {
      display: flex;
      justify-content: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .book-tab {
      border: 1px solid rgba(197, 134, 157, 0.44);
      background: linear-gradient(180deg, rgba(255, 247, 251, 0.92), rgba(243, 215, 226, 0.84));
      color: #8a4f64;
      font: 600 clamp(0.92rem, 1.3vw, 1.05rem)/1 "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.02em;
      padding: 0.48rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(121, 66, 85, 0.14);
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .book-tab:hover {
      transform: translateY(-1px);
      filter: saturate(1.05);
    }




    
    .book-tab.active {
      border-color: rgba(179, 104, 132, 0.6);
      box-shadow: 0 8px 18px rgba(121, 66, 85, 0.2), inset 0 0 0 1px rgba(255, 238, 245, 0.88);
      background: linear-gradient(180deg, rgba(255, 241, 247, 0.96), rgba(236, 187, 207, 0.88));
      color: #7a3c52;
    }

    .book-tab[data-month="2"].active {
      border-color: rgba(167, 129, 96, 0.52);
      box-shadow: 0 8px 18px rgba(118, 88, 60, 0.16), inset 0 0 0 1px rgba(252, 244, 233, 0.9);
      background: linear-gradient(180deg, rgba(252, 244, 233, 0.96), rgba(220, 193, 164, 0.9));
      color: #7d5a39;
    }

    .book-tab[data-month="3"].active {
      border-color: rgba(70, 151, 178, 0.58);
      box-shadow: 0 8px 18px rgba(39, 103, 128, 0.18), inset 0 0 0 1px rgba(226, 248, 252, 0.9);
      background: linear-gradient(180deg, rgba(235, 252, 255, 0.96), rgba(133, 205, 223, 0.88));
      color: #23657b;
    }

    .book-tab[data-month="4"].active {
      border-color: rgba(80, 80, 80, 0.62);
      box-shadow: 0 8px 18px rgba(20, 20, 20, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(182, 182, 182, 0.88));
      color: #222;
    }

    .book-tab[data-month="5"].active {
      border-color: rgba(127, 117, 139, 0.58);
      box-shadow: 0 8px 18px rgba(70, 62, 82, 0.16), inset 0 0 0 1px rgba(247, 244, 252, 0.9);
      background: linear-gradient(180deg, rgba(250, 249, 253, 0.96), rgba(203, 197, 213, 0.88));
      color: #50475d;
    }
  
    .month-page {
      display: none;
    }
  
    .month-page.active {
      display: block;
      animation: fadeUp 360ms ease both;
      min-height: 0;
      height: 100%;
    }

    .album {
      --album-panel: var(--panel);
      --album-panel-border: var(--panel-border);
      --album-wash-1: rgba(255, 255, 255, 0.63);
      --album-wash-2: rgba(255, 244, 247, 0.58);
      --album-wash-3: rgba(255, 249, 244, 0.62);
      --album-dash: rgba(214, 177, 122, 0.35);
      --album-signature: rgba(134, 71, 92, 0.9);
      --album-ring-1: rgba(255, 255, 255, 0.96);
      --album-ring-2: rgba(251, 233, 203, 0.94);
      --album-ring-3: rgba(216, 177, 122, 0.88);
      --album-ring-shadow-1: rgba(255, 255, 255, 0.4);
      --album-ring-shadow-2: rgba(247, 226, 193, 0.34);
      --album-card-bg: rgba(255, 255, 255, 0.97);
      --album-card-tape: linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(236, 214, 187, 0.68));
      --album-caption: #9a6074;
      position: relative;
      height: 100%;
      border-radius: 30px;
      overflow: hidden;
      border: 1px solid var(--album-panel-border);
      background:
        linear-gradient(155deg, var(--album-wash-1), var(--album-wash-2) 52%, var(--album-wash-3)),
        var(--album-panel);
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      isolation: isolate;
    }

    .album--month-2 {
      --album-panel: rgba(235, 214, 191, 0.88);
      --album-panel-border: rgba(198, 165, 133, 0.9);
      --album-wash-1: rgba(255, 247, 238, 0.8);
      --album-wash-2: rgba(222, 196, 171, 0.66);
      --album-wash-3: rgba(205, 174, 145, 0.56);

      --album-panel: rgba(238, 238, 238, 0.9);
      --album-panel-border: rgba(88, 88, 88, 0.62);

    .album::before {
      content: "";
      position: absolute;
      inset: 14% 10%;
      border-radius: 40%;
      border: 1px dashed var(--album-dash);
      pointer-events: none;
      z-index: 0;
    }

    .orbit {
      position: relative;
      z-index: 1;
      min-height: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .ring-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--ring-w);
      height: var(--ring-h);
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 46% / 50%;
      padding: clamp(10px, 1.05vw, 14px);
      cursor: pointer;
      z-index: 8;
      background:
        radial-gradient(circle at 26% 22%, var(--album-ring-1), var(--album-ring-2) 62%, var(--album-ring-3));
      box-shadow:
        0 0 0 12px var(--album-ring-shadow-1),
        0 0 0 24px var(--album-ring-shadow-2),
        0 18px 40px rgba(120, 80, 39, 0.28);
      animation: centerPulse 4s ease-in-out infinite;
    }

    .ring-center:focus-visible,
    .photo:focus-visible,
    .close:focus-visible {
      outline: 2px solid #d18aa3;
      outline-offset: 3px;
    }

    .ring-center img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 46% / 50%;
      border: 3px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 20px rgba(98, 58, 34, 0.3);
    }

    .photo {
      --tx: 0px;
      --ty: 0px;
      --mx: 0px;
      --my: 0px;
      --mr: 0deg;
      --r: 0deg;
      --s: 1;
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--photo-w);
      transform: translate(-50%, -50%) translate(calc(var(--tx) + var(--mx)), calc(var(--ty) + var(--my))) rotate(calc(var(--r) + var(--mr))) scale(var(--s));
      transform-origin: 50% 8%;
      border: 0;
      border-radius: 16px;
      padding: 0.52rem 0.52rem 0.62rem;
      background: var(--album-card-bg);
