  <title>Nuestro Album</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

    :root {
      --bg-rose: #f7e5ea;
      --bg-peach: #f8efe9;
      --bg-cream: #fffaf3;
      --ink: #5a3441;
      --ink-soft: #7c5260;
      --accent: #c9859d;
      --accent-soft: #f0cfd9;
      --gold: #d6b17a;
      --panel: rgba(255, 247, 251, 0.82);
      --panel-border: rgba(255, 236, 244, 0.95);
      --photo-w: clamp(130px, 12vw, 180px);
      --photo-h: clamp(160px, 15vw, 225px);
      --ring-w: clamp(230px, 21vw, 320px);
      --ring-h: clamp(300px, 29vw, 420px);
      --shadow-soft: 0 18px 45px rgba(92, 52, 65, 0.15);
      --shadow-card: 0 16px 34px rgba(76, 42, 52, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--ink);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.28)),
        url("fondo/Copilot_20260310_012828.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.22;
      background-image:
        radial-gradient(circle at 18% 28%, rgba(255, 255, 255, 0.65) 0 1px, transparent 2px),
        radial-gradient(circle at 66% 36%, rgba(255, 255, 255, 0.45) 0 1px, transparent 2px),
        radial-gradient(circle at 38% 76%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2px),
        radial-gradient(circle at 84% 84%, rgba(255, 255, 255, 0.5) 0 1px, transparent 2px);
      background-size: 180px 180px, 160px 160px, 200px 200px, 220px 220px;
    }

    .border-romance {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      perspective: 1000px;
    }

    .border-romance::after {
      content: "";
      position: absolute;
      inset: clamp(8px, 1.2vw, 16px);
      border-radius: 26px;
      border: 2px solid rgba(214, 160, 181, 0.68);
      box-shadow:
        inset 0 0 0 1px rgba(255, 226, 236, 0.75),
        0 0 18px rgba(196, 132, 156, 0.3);
    }

    .border-romance::before {
      content: "";
      position: absolute;
      inset: clamp(8px, 1.2vw, 16px);
      border-radius: 26px;
      background:
        linear-gradient(to bottom, rgba(245, 191, 210, 0.34), transparent 16%, transparent 84%, rgba(228, 171, 193, 0.4)),
        linear-gradient(to right, rgba(241, 186, 208, 0.34), transparent 14%, transparent 86%, rgba(227, 170, 192, 0.34));
      pointer-events: none;
    }

    .night {
      display: none;
    }

    .border-garden {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .single-flower {
      position: absolute;
      left: 50%;
      bottom: 2%;
      transform: translateX(-50%) scale(0.62);
      transform-origin: bottom center;
      z-index: 4;
      filter: drop-shadow(0 16px 22px rgba(5, 39, 19, 0.45));
    }

    .single-flower .flowers {
      transform: none;
    }

    .single-flower::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10vmin;
      width: 90vmin;
      height: 44vmin;
      transform: translateX(-50%);
      background:
        radial-gradient(34% 70% at 18% 100%, rgba(97, 150, 113, 0.88), transparent 72%),
        radial-gradient(34% 70% at 33% 100%, rgba(113, 168, 127, 0.84), transparent 72%),
        radial-gradient(34% 70% at 50% 100%, rgba(124, 176, 136, 0.8), transparent 72%),
        radial-gradient(34% 70% at 67% 100%, rgba(111, 165, 125, 0.84), transparent 72%),
        radial-gradient(34% 70% at 82% 100%, rgba(95, 146, 110, 0.88), transparent 72%);
      z-index: -1;
      opacity: 0.95;
    }

    .edge-flower {
      position: absolute;
      --s: 0.14;
      --rot: 0deg;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(var(--s));
      transform-origin: center center;
      overflow: visible;
    }

    .edge-flower::before,
    .edge-flower::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10vmin;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 1;
      animation: vegetationSway 3.8s ease-in-out infinite;
    }

    .edge-flower::before {
      width: 36vmin;
      height: 24vmin;
      background:
        radial-gradient(44% 52% at 18% 86%, rgba(10, 120, 52, 0.9), transparent 72%),
        radial-gradient(42% 55% at 35% 90%, rgba(8, 136, 58, 0.85), transparent 72%),
        radial-gradient(40% 56% at 54% 92%, rgba(12, 146, 62, 0.82), transparent 72%),

      opacity: 0.92;

    .edge-flower::after {

      height: 30vmin;
      background:

        linear-gradient(100deg, transparent 48%, rgba(6, 130, 54, 0.7) 50%, transparent 52%),
        linear-gradient(125deg, transparent 49%, rgba(12, 155, 67, 0.72) 50%, transparent 51%),
        linear-gradient(55deg, transparent 49%, rgba(9, 122, 51, 0.68) 50%, transparent 51%);
      opacity: 0.8;
    }

    .edge-flower--02 { left: 26%; top: 6%; --s: 0.12; --rot: 168deg; }
    .edge-flower--03 { left: 50%; top: 5%; --s: 0.12; --rot: 180deg; }
    .edge-flower--04 { left: 74%; top: 6%; --s: 0.12; --rot: 194deg; }
    .edge-flower--05 { left: 93%; top: 9%; --s: 0.15; --rot: 214deg; }
    .edge-flower--06 { left: 96%; top: 32%; --s: 0.12; --rot: 250deg; }
    .edge-flower--07 { left: 96%; top: 68%; --s: 0.12; --rot: 286deg; }
    .edge-flower--08 { left: 93%; top: 91%; --s: 0.15; --rot: 328deg; }
    .edge-flower--09 { left: 74%; top: 94%; --s: 0.12; --rot: 352deg; }
    .edge-flower--10 { left: 50%; top: 95%; --s: 0.12; --rot: 0deg; }
    .edge-flower--11 { left: 26%; top: 94%; --s: 0.12; --rot: 12deg; }
    .edge-flower--12 { left: 7%; top: 91%; --s: 0.15; --rot: 34deg; }
    .edge-flower--13 { left: 4%; top: 68%; --s: 0.12; --rot: 72deg; }
    .edge-flower--14 { left: 4%; top: 32%; --s: 0.12; --rot: 106deg; }

    .flowers {
      position: relative;
      transform: scale(0.9);
      overflow: visible;
    }

    .edge-flower .flowers::before,
    .edge-flower .flowers::after {

      height: 22vmin;

      background:
        radial-gradient(70% 66% at 8% 88%, rgba(4, 110, 46, 0.94), transparent 74%),
        radial-gradient(66% 64% at 24% 92%, rgba(7, 129, 53, 0.9), transparent 74%),
        radial-gradient(62% 62% at 42% 94%, rgba(8, 142, 58, 0.88), transparent 74%),
        radial-gradient(64% 62% at 61% 94%, rgba(7, 133, 54, 0.9), transparent 74%),
        radial-gradient(70% 64% at 82% 90%, rgba(4, 112, 46, 0.9), transparent 74%),
        radial-gradient(68% 60% at 96% 86%, rgba(3, 98, 42, 0.86), transparent 74%);

    .edge-flower .flowers::after {
      width: 26vmin;
      height: 30vmin;
      transform: translateX(-50%) rotate(10deg);
      background:

        linear-gradient(78deg, transparent 47%, rgba(11, 151, 63, 0.7) 50%, transparent 53%),
        linear-gradient(98deg, transparent 47%, rgba(7, 132, 54, 0.7) 50%, transparent 53%),
        linear-gradient(118deg, transparent 48%, rgba(8, 141, 57, 0.66) 50%, transparent 52%);

    .flower {
      position: absolute;
      bottom: 10vmin;
      transform-origin: bottom center;
      z-index: 10;
      --fl-speed: 0.8s;
    }

    .edge-flower .flower::before,
    .edge-flower .flower::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6vmin;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: -1;
    }

    .edge-flower .flower::before {
      width: 22vmin;
      height: 14vmin;
      background:

        radial-gradient(45% 72% at 32% 98%, rgba(5, 120, 49, 0.9), transparent 74%),
        radial-gradient(45% 72% at 54% 100%, rgba(7, 135, 55, 0.88), transparent 74%),
        radial-gradient(45% 72% at 76% 98%, rgba(5, 118, 48, 0.9), transparent 74%),
        radial-gradient(45% 70% at 94% 96%, rgba(3, 98, 42, 0.9), transparent 74%);

    .edge-flower .flower::after {
      width: 20vmin;
      height: 18vmin;
      background:

    }

    .flower--1 .flower__line__leaf--3 {
      animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
    }

    .flower--1 .flower__line__leaf--4 {
      animation: blooming-leaf-left var(--fl-speed) 1s backwards;

    .flower--1 .flower__line__leaf--5 {
      animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
    }

    .flower--1 .flower__line__leaf--6 {

    .flower--2 {

    }

    .flower--2 .flower__line {

    }

    .flower--2 .flower__line__leaf--2 {
      animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
    }

    .flower--2 .flower__line__leaf--3 {
      animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
    }

    .flower--2 .flower__line__leaf--4 {
      animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
    }

    .flower--3 {

      transform: rotate(-15deg);
      animation: moving-flower-3 4s linear infinite;
    }

    .flower--3 .flower__line {
      animation-delay: 0.9s;
    }

    .flower--3 .flower__line__leaf--1 {
      animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
    }

    .flower--3 .flower__line__leaf--2 {
      animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
    }

    .flower--3 .flower__line__leaf--3 {
      animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
    }

    .flower--3 .flower__line__leaf--4 {
      animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
    }

    .flower__leafs {
      position: relative;
      animation: blooming-flower 2s backwards;
    }

    .flower__leafs--1 {
      animation-delay: 1.1s;
    }

    .flower__leafs--2 {
      animation-delay: 1.4s;
    }

    .flower__leafs--3 {
      animation-delay: 1.7s;
    }

    .flower__leafs::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      width: 8vmin;
      height: 8vmin;
      background-color: #e7b201;
      filter: blur(10vmin);
    }

    .flower__leaf {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 8vmin;
      height: 11vmin;
      border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;

    .flower__leaf--1 {
      transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
    }

    .flower__leaf--2 {
      transform: translate(-50%, -4%) rotateX(40deg);

    .flower__leaf--3 {

    .flower__leaf--4 {
      width: 8vmin;

    .flower__white-circle {
      position: absolute;
      left: -3.5vmin;
      top: -3vmin;
      width: 9vmin;
      height: 4vmin;
      border-radius: 50%;

    }

    .flower__white-circle::after {
      content: "";

      left: 50%;
      top: 45%;

      width: 60%;
      height: 60%;
      border-radius: inherit;
      background-image: linear-gradient(90deg, rgb(255, 235, 18), rgb(255, 206, 0));

    .flower__line {
      height: 55vmin;
      width: 1.5vmin;
      background-image: linear-gradient(
          to left,
          rgba(0, 0, 0, 0.2),
          transparent,
          rgba(255, 255, 255, 0.2)

        linear-gradient(to top, transparent 10%, #6ea783, #87bc98);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
      animation: grow-flower-tree 4s backwards;
    }

    .flower__line__leaf {
      --w: 7vmin;
      --h: calc(var(--w) + 2vmin);
      position: absolute;
      top: 20%;
      left: 90%;
      width: var(--w);
      height: var(--h);
      border-top-right-radius: var(--h);
      border-bottom-left-radius: var(--h);
      background-image: linear-gradient(to top, rgba(84, 133, 99, 0.4), #87bc98);
    }

    .flower__line__leaf--1 {
      transform: rotate(70deg) rotateY(30deg);
    }

    .flower__line__leaf--2 {
      top: 45%;
      transform: rotate(70deg) rotateY(30deg);
    }

    .flower__line__leaf--3,
    .flower__line__leaf--4,
    .flower__line__leaf--6 {
      border-top-right-radius: 0;
      border-bottom-left-radius: 0;
      border-top-left-radius: var(--h);
      border-bottom-right-radius: var(--h);
      left: -460%;
      top: 12%;
      transform: rotate(-70deg) rotateY(30deg);
    }

    .flower__line__leaf--4 {
      top: 40%;
    }

    .flower__line__leaf--5 {
      top: 0;
      transform-origin: left;
      transform: rotate(70deg) rotateY(30deg) scale(0.6);
    }

    .flower__line__leaf--6 {
      top: -2%;

    .flower__light {
      position: absolute;
      bottom: 0vmin;
      width: 1vmin;
      height: 1vmin;
      background-color: rgb(255, 251, 0);
      border-radius: 50%;
      filter: blur(0.2vmin);
      animation: light-ans 4s linear infinite backwards;
    }

    .flower__light:nth-child(odd) {
      background-color: #8fbe9f;

    .flower__light--1 {
      left: -2vmin;

    }

    .flower__light--2 {
      left: 3vmin;

    .flower__light--3 {
      left: -6vmin;

    }

    .flower__light--4 {
      left: 6vmin;
      animation-delay: 0.9s;
    }

    .flower__light--5 {
      left: -1vmin;

    }

    .flower__light--6 {

    }

    .flower__light--8 {

      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      pointer-events: none;
